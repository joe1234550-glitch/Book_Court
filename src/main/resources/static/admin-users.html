<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>後端 管理 - Users</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:20px;}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style>
</head>
<body>
  <h1>管理：使用者</h1>
  <p><a href="/admin-courts.html">回管理首頁</a></p>
  <div id="tokenArea"></div>
  <button id="btnRefresh">取得 Access Token</button>

  <h2>所有使用者</h2>
  <div id="list"></div>

  <h2>更新使用者</h2>
  <form id="updateForm">
    id: <input name="id" /> <br/>
    username: <input name="username" /> <br/>
    email: <input name="email" /> <br/>
    enabled: <select name="enabled"><option value="true">true</option><option value="false">false</option></select> <br/>
    roles (comma separated): <input name="roles" /> <br/>
    <button type="submit">更新</button>
  </form>

  <script>
    let accessToken = null;
    async function refresh() {
      const res = await fetch('/api/auth/refresh/cookie', { method: 'GET' });
      if (!res.ok) throw new Error('refresh failed');
      const body = await res.json();
      accessToken = body.accessToken;
      document.getElementById('tokenArea').innerText = 'Access Token ready';
    }

    document.getElementById('btnRefresh').addEventListener('click', async () => {
      try { await refresh(); await loadList(); } catch(e){ alert('刷新失敗'); }
    });

    async function loadList() {
      const res = await fetch('/api/v1/admin/users', { headers: { 'Authorization': 'Bearer ' + accessToken } });
      if (!res.ok) { document.getElementById('list').innerText = '載入失敗'; return; }
      const data = await res.json();
      const html = ['<table><tr><th>ID</th><th>Username</th><th>Email</th><th>Enabled</th></tr>'];
      for (const u of data) {
        html.push(`<tr><td>${u.id}</td><td>${u.username}</td><td>${u.email}</td><td>${u.enabled}</td></tr>`);
      }
      html.push('</table>');
      document.getElementById('list').innerHTML = html.join('');
    }

    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const id = fd.get('id');
      const body = { username: fd.get('username'), email: fd.get('email'), enabled: fd.get('enabled') === 'true', roles: fd.get('roles') ? fd.get('roles').split(',').map(s=>s.trim()) : [] };
      const res = await fetch('/api/v1/admin/users/' + id, { method: 'PUT', headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + accessToken }, body: JSON.stringify(body) });
      if (res.ok) { alert('更新成功'); await loadList(); } else { alert('更新失敗'); }
    });
  </script>
</body>
</html>
