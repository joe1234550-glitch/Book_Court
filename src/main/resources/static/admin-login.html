<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理員登入</title>
    <style>
      body {
        font-family: 'Noto Sans TC', sans-serif;
        background: #eef2ff;
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        width: min(460px, 100%);
        background: white;
        border-radius: 18px;
        box-shadow: 0 20px 80px rgba(15, 23, 42, 0.12);
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 24px;
        color: #4b5563;
        line-height: 1.7;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        font-size: 15px;
        margin-bottom: 18px;
        outline: none;
        transition: border-color 0.2s ease;
      }
      input:focus {
        border-color: #6366f1;
      }
      button {
        width: 100%;
        padding: 14px 16px;
        border: none;
        border-radius: 12px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      .message {
        margin: 18px 0 0;
        font-size: 14px;
        color: #374151;
        word-break: break-word;
      }
      .success {
        color: #047857;
      }
      .error {
        color: #b91c1c;
      }
      .hint {
        margin-top: 16px;
        font-size: 13px;
        color: #6b7280;
      }
      .token-box {
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 12px;
        margin-top: 12px;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>後端管理員登入</h1>
      <p>請輸入管理員帳號，以取得後端登入結果或 Token。此頁面不會直接連動前端 SPA。</p>

      <form method="post" action="/admin/login">
        <label for="username">使用者名稱</label>
        <input id="username" name="username" type="text" placeholder="adminuser" autocomplete="username" required />

        <label for="password">密碼</label>
        <input id="password" name="password" type="password" placeholder="password123" autocomplete="current-password" required />

        <button type="submit">送出登入</button>
      </form>

      <p class="hint">登入後，後端會直接回傳狀態頁面，並顯示 Access Token / Refresh Token。</p>
    </div>
  </body>
</html>
  </body>
</html>
